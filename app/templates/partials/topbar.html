{% from "_macros.html" import icon %}
<header class="topbar">
  <button type="button" class="icon-btn only-mobile" data-sidebar-open aria-label="Buka menu">
    {{ icon('menu') }}
  </button>

  <div class="topbar-title">
    <h1>{{ page_title }}</h1>
    <p class="topbar-sub">{{ profil.nama }}{% if profil.kecamatan %} · {{ profil.kecamatan }}{% endif %}</p>
  </div>

  <div class="topbar-actions">
    {% if user and user.is_staff %}
      <a class="btn btn-primary btn-sm" href="/impor">{{ icon('upload') }} <span class="hide-sm">Impor Berkas</span></a>
      <a class="btn btn-outline btn-sm" href="/data-siswa/baru">{{ icon('plus') }} <span class="hide-sm">Siswa</span></a>
    {% endif %}
    <div class="avatar" title="{{ user.nama if user else '' }}">{{ user.inisial if user else '?' }}</div>
  </div>
</header>
